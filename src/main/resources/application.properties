# Configuracion de Base de Datos (con fallback para desarrollo local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/backenpti?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Pool de Conexiones HikariCP (Optimizado para Clever Cloud / Free Tier con max 5 conexiones)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Configuracion JWT
jwt.secret=${JWT_SECRET:secret}
jwt.expiration=3600

# Configuracion de subida de archivos (Multipart)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads

# Configuracion de Email (SMTP Brevo)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:75c67e001@smtp-brevo.com}
spring.mail.password=${MAIL_PASSWORD:}
mail.from=${MAIL_FROM:tomasperesin@gmail.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# URL del Frontend para enlaces generados en correos
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# Clave secreta para registrar usuarios con rol Administrador
app.admin.secret=${ADMIN_SECRET:admin123}